name: CI
on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bazel
        uses: abhinavsingh/setup-bazel@v3
        with:
          version: 9.0.1
      # This remaps directories, which doesn't work well with BID.
      #- name: Setup bazel
        #uses: bazel-contrib/setup-bazel@0.15.0
        #with:
          #bazelisk-cache: true
          #disk-cache: ${{ github.workflow }}
          #repository-cache: true
      - name: "Build everything"
        run: "bazel build //..."
      - name: "Test everything"
        run: "bazel test //..."
