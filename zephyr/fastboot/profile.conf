#
# The fastboot server saying where a download's time goes (issue 1230):
# the Ethernet driver's cycles and frames, the time in `recv`, in the
# fastboot core and in the copy to the staging area, and every thread's
# cycles across the connection, on the console when it closes.
CONFIG_ETH_VRETENO_PROFILE=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
