#
# A TCP server on the board's Ethernet port (issue 143).
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_ENTROPY_GENERATOR=y
# The entropy driver conditions with Mbed TLS SHA-256 (issue 780).
CONFIG_MBEDTLS=y

# The address. Fastboot's device is the server, so the host has to
# know where it is before anything else happens. A static address is
# the default because it needs nothing else on the network; a build
# for a network with a DHCP server turns on `NET_DHCPV4` instead. Both
# are settings, and a build for another network overrides them with
# the image rule's `conf` fragment.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# The download arrives in segments of a frame; a little room to hold
# them while the core writes each into DDR3.
CONFIG_NET_PKT_RX_COUNT=16
# A buffer a frame (issue 1434). At the default 128 bytes a segment was
# a dozen buffers, each allocated, walked by the packet cursor, locked
# and freed: on the model's download 77.8 cycles a byte of work, and
# 63.3 with a buffer a frame. Fourteen to receive and four to send, the
# sends being acknowledgements, are 27 KiB of the core's 64.
CONFIG_NET_BUF_RX_COUNT=14
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_BUF_DATA_SIZE=1536
# The window Zephyr derived from the old buffers, a third of their
# bytes, about two segments: a third of the new ones lets the sender
# burst more frames than the port and the MAC hold, and on the model
# frames were dropped and timed out.
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=2920
CONFIG_MAIN_STACK_SIZE=4096

# Minimal libc's string functions for speed, not size (#1230): the
# size-optimised `memcpy` is a byte loop, and the Ethernet driver's copy
# of each frame out of its slot in the DDR3 was then one uncached load
# a byte, 82K cycles a 1514-byte frame on the board.
CONFIG_MINIMAL_LIBC_OPTIMIZE_STRING_FOR_SIZE=n

CONFIG_PRINTK=y
# Code in the DDR3 and data in the core's own memory (issue 1230): the
# image runs in place and copies its data across as it starts.
CONFIG_XIP=y
