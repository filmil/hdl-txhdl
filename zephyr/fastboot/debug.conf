#
# The fastboot server with the network stack saying what it does, for
# finding where a frame stops on the board (#786): the Ethernet driver,
# the Ethernet layer, the interface, ARP and the address settings, at
# debug, written as they happen rather than from a log thread.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_NET_LOG=y
CONFIG_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y
CONFIG_NET_IF_LOG_LEVEL_DBG=y
CONFIG_NET_ARP_LOG_LEVEL_DBG=y
CONFIG_NET_CONFIG_LOG_LEVEL_DBG=y
