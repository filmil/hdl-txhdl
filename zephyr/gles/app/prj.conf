# The program says what it does on the console, and needs nothing else.
CONFIG_PRINTK=y
# GL's matrices and a triangle's setup are on the stack, which is more
# than Zephyr's kilobyte for main.
CONFIG_MAIN_STACK_SIZE=16384
# Code in the DDR3 and the RAM in the core's own memory, which the
# board overlay names (issue 1287).
CONFIG_XIP=y
