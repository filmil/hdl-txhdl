#
# Enough of a network stack that the Ethernet driver is compiled.
#
# `hello_world` wants none of this, and `ETH_VRETENO` depends on
# `NETWORKING`, so without a fragment like this the driver is never
# handed to a compiler. That is how `uart_vreteno.c` kept an implicit
# declaration of `sys_read32` for as long as it did: written,
# committed, checked by a test that reads it as text, and never built.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y

# IPv6 off, because nothing here needs it and it is the larger half of
# the stack.
CONFIG_NET_IPV6=n

# The stack wants randomness, and the machine has an entropy source
# (issue 458): ring oscillators sampled, debiased and buffered by the
# hardware at `0x3500`, read by `entropy_vreteno.c`. `net_if` calls
# `sys_rand_get`, and with an entropy driver present the random
# subsystem takes its numbers from the device. This image once took
# Zephyr's test generator instead, which is a counter; the module's
# CMake now refuses a network build that does, so that a build that
# succeeds is one whose sequence numbers are not predictable.
CONFIG_ENTROPY_GENERATOR=y
