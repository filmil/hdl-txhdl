#
# Enough of a network stack that the Ethernet driver is compiled.
#
# `hello_world` wants none of this, and `ETH_VRETENO` depends on
# `NETWORKING`, so without a fragment like this the driver is never
# handed to a compiler. That is how `uart_vreteno.c` kept an implicit
# declaration of `sys_read32` for as long as it did: written,
# committed, checked by a test that reads it as text, and never built.
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y

# IPv6 off, because nothing here needs it and it is the larger half of
# the stack.
CONFIG_NET_IPV6=n

# The stack wants randomness and this machine has none.
#
# `net_if` calls `sys_rand_get`, so a build without an entropy source
# does not link: `undefined reference to z_impl_sys_rand_get`. Vreteno
# has no hardware random generator, so this image takes Zephyr's test
# generator, which is a counter and is not random at all.
#
# That is honest for an image whose purpose is to compile the driver
# and which never touches a wire. It is not honest for anything that
# speaks to another machine: TCP's initial sequence numbers come from
# here, and so would anything cryptographic. A real network build on
# this board needs an entropy source that does not exist yet, and
# issue 143's fastboot over TCP is the first thing that will want one.
CONFIG_TEST_RANDOM_GENERATOR=y
