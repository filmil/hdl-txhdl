# SPDX-License-Identifier: Apache-2.0
#
# The console, and the network stack with TCP, which is what an
# application outside the port most often wants the port for; the
# rest as the port's own net.conf has it.
CONFIG_PRINTK=y
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_MBEDTLS=y
