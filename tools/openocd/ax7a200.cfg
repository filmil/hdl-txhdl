# OpenOCD on the AX7A200B through its Digilent cable, to Vreteno's debug
# transport behind BSCANE2 on USER4 (#154, #895). docs/board-checks.md
# section 4 copies this file to the board server and runs it there.

# The cable is an FT232H, 0403:6014, with Digilent's HS2 pin setup. The
# HS2 file names the product "Digilent Adept USB Device", but this board's
# cable enumerates as "Digilent USB Device" (sysfs product, serial
# 210251130202), so the name is set again after it.
source [find interface/ftdi/digilent-hs2.cfg]
ftdi device_desc "Digilent USB Device"

transport select jtag
adapter speed 1000

# The XC7A200T, and the core behind its USER4 scan chain, as
# //cpu/vreteno:openocd_test configures the simulated board.
jtag newtap xc7 tap -irlen 6 -expected-id 0x13636093
target create xc7.cpu riscv -chain-position xc7.tap
riscv use_bscan_tunnel 5
riscv set_mem_access sysbus
