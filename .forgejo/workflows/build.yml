# SPDX-License-Identifier: Apache-2.0
# Build and test on every pull request and on every push to a mainline branch.
#
# Building everything is most of the test: every document target renders a PDF
# and an HTML page, and a document that does not render fails the build.
name: build

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  build:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      # Nothing else is installed. Every other tool this build needs comes
      # from MODULE.bazel, including pandoc, TeX and the C compiler.
      #
      # Do not replace this with a setup-bazel action. Those resolve the
      # `bazelbuild` organization through the API of the instance they run
      # on, which here is git.hdlfactory.com, and fail with
      # `GetUserByName ... does not exist`.
      - name: Install Bazelisk (pinned)
        run: |
          set -eux
          { command -v curl && command -v git; } >/dev/null 2>&1 || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git
          }
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /usr/local/bin/bazel" | sha256sum -c
          chmod +x /usr/local/bin/bazel

      # A cold build fetches a Debian rootfs, a Zig toolchain, graphviz built
      # from source and a TeX installation, which is roughly 950 actions. The
      # runner is serial, so a cache miss costs every other queued run.
      - name: Cache Bazel
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-

      # `pipefail`, or the step's status is `tee`'s, which is 0: a build that
      # failed would pass here and turn the run red only in the test step
      # below, with its error inside that step's output (#538).
      - name: Build everything
        run: |
          set -o pipefail
          bazel build //... 2>&1 | tee -a /tmp/ci-bazel.log

      # Bazel exits 4 when testing is requested and no test target exists,
      # which is the state until the specification's examples become a test
      # corpus. Every other non-zero exit still fails the job, and a test
      # added later runs here without touching this file.
      - name: Test everything
        run: |
          set -o pipefail
          bazel test //... --test_output=errors 2>&1 | tee -a /tmp/ci-bazel.log || {
            status=$?
            [ "$status" -eq 4 ] || exit "$status"
            echo "no test targets yet; build is the only gate"
          }

      # `fj` cannot read Actions logs and the API's log routes answer 404
      # even with a token, so a failing run exports its own. It lands on the
      # `ci-logs` branch, readable by anyone who can clone:
      #
      #   git fetch origin ci-logs && git show origin/ci-logs:<file>
      #
      # #466. The branch is fetched rather than re-initialised, so a run can
      # be compared with the one before it; most of what was wanted on 737
      # was seeing how it differed from 733.
      - name: Export the log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== run ${GITHUB_RUN_NUMBER} on ${GITHUB_SHA} (${GITHUB_EVENT_NAME}) ==="
            echo "=== df -h ==="; df -h / /data/cache/bazel 2>/dev/null | sort -u
            echo "=== free -m ==="; free -m
            echo "=== bazel log tail ==="
            tail -c 60000 /tmp/ci-bazel.log 2>/dev/null || echo "(no bazel log)"
          } > /tmp/ci-tail.log 2>&1 || echo "(capture failed)" >> /tmp/ci-tail.log
          d=$(mktemp -d)
          url="https://ci:${GITHUB_TOKEN}@git.hdlfactory.com/${GITHUB_REPOSITORY}.git"
          # Add to the branch when it exists; start it when it does not.
          if git -C "$d" clone -q --depth 1 --branch ci-logs "$url" . 2>/dev/null; then
            :
          else
            git -C "$d" init -q -b ci-logs
            git -C "$d" remote add origin "$url"
          fi
          cp /tmp/ci-tail.log \
            "$d/run-${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA:0:8}.log"
          git -C "$d" add -A
          git -C "$d" -c user.name=ci -c user.email=ci@invalid \
            commit -qm "ci log for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git -C "$d" push -q origin ci-logs
