# Publish the rendered documents as a release.
#
# Two ways in, one job, two kinds of release.
#
#   schedule          -> the rolling `nightly` release, overwritten each night
#   workflow_dispatch -> a new release stamped with the UTC date and time
#
# The nightly is a moving target, so somebody who wants "the current
# documents" always has one link. A dispatched release is a fixed point that
# nothing later overwrites, which is what makes it worth cutting by hand.
#
# The same assets go to the GitHub mirror as a release of the same name,
# when able: the step needs A_GITHUB_MIRROR_TOKEN, the token the mirror
# workflow pushes with, and skips without it. The Forgejo release is the
# release; the copy is the spare, and its failure does not fail the run.
name: release

on:
  schedule:
    # 03:00 UTC daily.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: docker
    steps:
      # fetch-depth 0, because the nightly skip below reads the commit dates.
      # A shallow clone shows one commit whatever actually happened.
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      # Only a scheduled run can decide there is nothing to do. A nightly with
      # no commits behind it would repeat yesterday's release, and a list of
      # identical releases hides the ones that differ.
      #
      # Every other event proceeds. That includes a manual dispatch, and it
      # includes whatever event a local `act` run supplies, so testing this
      # workflow locally does not silently skip every step and report success.
      - name: Decide whether to release
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" != "schedule" ]; then
            echo "event is '$EVENT', proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git log --since='25 hours ago' --format=%H)" ]; then
            echo "commits landed since the last nightly, proceeding"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no commit in the last 25 hours, skipping"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      # The scheduled release is rolling and overwrites its own assets, so
      # one link always points at the current documents. Every other run
      # produces a release stamped with the UTC date and time, with override
      # off, so nothing later destroys a release somebody asked for.
      - name: Compute the tag
        if: steps.decide.outputs.proceed == 'true'
        id: tag
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "schedule" ]; then
            tag="nightly"
            override=true
          else
            tag="release-$(date -u +%Y%m%d-%H%M%S)"
            override=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "override=$override" >> "$GITHUB_OUTPUT"
          echo "releasing as $tag (override=$override)"

      # Nothing else is installed. Every other tool this build needs comes
      # from MODULE.bazel, including pandoc, TeX and the C compiler.
      - name: Install Bazelisk (pinned)
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -eux
          { command -v curl && command -v git; } >/dev/null 2>&1 || {
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates curl git
          }
          curl -fsSL -o /usr/local/bin/bazel \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.29.0/bazelisk-linux-amd64
          echo "5a408715e932c0250d28bd84555f12edbf70117de42f9181691c736eacc4a992  /usr/local/bin/bazel" | sha256sum -c
          chmod +x /usr/local/bin/bazel

      - name: Cache Bazel
        if: steps.decide.outputs.proceed == 'true'
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ hashFiles('.bazelversion', '.bazelrc', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-

      - name: Build everything
        if: steps.decide.outputs.proceed == 'true'
        run: bazel build //...

      # bazel-bin is a symlink, so find needs -L to walk it. Only //docs is
      # gathered: external repositories under bazel-bin/external hold PNGs
      # of their own. The waveforms (.fst) ship too, for a viewer. The output path
      # becomes the file name, so two packages that each produce `spec-pdf.pdf`
      # do not overwrite one another in the release directory.
      - name: Gather the documents
        if: steps.decide.outputs.proceed == 'true'
        run: |
          set -eu
          mkdir -p dist/release
          find -L bazel-bin/docs -type f \
              \( -name '*.pdf' -o -name '*.html' -o -name '*.png' -o -name '*.fst' \) -print0 |
            while IFS= read -r -d '' f; do
              rel="${f#bazel-bin/}"
              cp "$f" "dist/release/$(printf '%s' "$rel" | tr '/' '-')"
            done
          ls -la dist/release
          [ -n "$(ls -A dist/release)" ] || { echo "nothing to release" >&2; exit 1; }

      # Referenced by full URL so it resolves whatever the instance's default
      # action host is. The built-in per-run token is enough given
      # `permissions: contents: write`; FORGEJO_RELEASE_TOKEN wins when set.
      - name: Publish the release
        if: steps.decide.outputs.proceed == 'true'
        uses: https://code.forgejo.org/actions/forgejo-release@v2.13.4
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          tag: ${{ steps.tag.outputs.tag }}
          release-dir: dist/release
          override: ${{ steps.tag.outputs.override }}
          token: ${{ secrets.FORGEJO_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # The copy on GitHub. The commit goes first, so the release has
      # something to point at; the mirror workflow pushes main on every
      # push, so this is usually a no-op. The rolling release is remade
      # from scratch, its old release and tag deleted, since GitHub does
      # not move a release to a new commit; a stamped release is new by
      # construction. The API is spoken with curl alone, since the runner
      # has nothing else; the release id is the first "id" in the reply.
      - name: Copy the release to GitHub
        if: steps.decide.outputs.proceed == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.A_GITHUB_MIRROR_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          OVERRIDE: ${{ steps.tag.outputs.override }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ -z "$TOKEN" ]; then
            echo "A_GITHUB_MIRROR_TOKEN is not set; no copy to GitHub" >&2
            exit 0
          fi
          api="https://api.github.com/repos/filmil/hdl-txhdl"
          auth="Authorization: Bearer $TOKEN"
          accept="Accept: application/vnd.github+json"
          release_id() { sed -n 's/^ *"id": *\([0-9]*\),.*/\1/p' | head -1; }
          git remote add github "https://x-access-token:${TOKEN}@github.com/filmil/hdl-txhdl.git"
          git push github "HEAD:refs/heads/main" ||
            echo "main not pushed; the mirror may have it already" >&2
          if [ "$OVERRIDE" = "true" ]; then
            old=$(curl -sS -H "$auth" -H "$accept" "$api/releases/tags/$TAG" | release_id)
            if [ -n "$old" ]; then
              curl -fsS -X DELETE -H "$auth" -H "$accept" "$api/releases/$old"
              echo "deleted the old release $old of $TAG"
            fi
            curl -sS -X DELETE -H "$auth" -H "$accept" "$api/git/refs/tags/$TAG" > /dev/null || true
          fi
          body=$(printf '{"tag_name":"%s","target_commitish":"%s","name":"%s","prerelease":%s}' \
            "$TAG" "$SHA" "$TAG" "$OVERRIDE")
          id=$(curl -fsS -X POST -H "$auth" -H "$accept" "$api/releases" -d "$body" | release_id)
          [ -n "$id" ] || { echo "GitHub gave no release id" >&2; exit 1; }
          for f in dist/release/*; do
            name=$(basename "$f")
            curl -fsS -X POST -H "$auth" -H "$accept" \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/filmil/hdl-txhdl/releases/$id/assets?name=$name" \
              --data-binary "@$f" > /dev/null
            echo "uploaded $name"
          done
          echo "released $TAG on GitHub as release $id"
